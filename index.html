function circleRect(o,b){
  let nearestX=clamp(o.x,b.x,b.x+b.w),nearestY=clamp(o.y,b.y,b.y+b.h),dx=o.x-nearestX,dy=o.y-nearestY,d=hypot(dx,dy),nx=0,ny=0,push=0;
  if(d>=o.r)return false;
  if(d>.0001){nx=dx/d;ny=dy/d;push=o.r-d}
  else{
    let left=o.x-b.x,right=b.x+b.w-o.x,top=o.y-b.y,bottom=b.y+b.h-o.y,minEdge=Math.min(left,right,top,bottom);
    if(minEdge===left){nx=-1;push=o.r+left}
    else if(minEdge===right){nx=1;push=o.r+right}
    else if(minEdge===top){ny=-1;push=o.r+top}
    else{ny=1;push=o.r+bottom}
  }
  o.x+=nx*push;o.y+=ny*push;
  let inward=num(o.vx)*nx+num(o.vy)*ny;
  if(inward<0){o.vx-=inward*1.25*nx;o.vy-=inward*1.25*ny}
  return true
}

function drawLevelMapPreview(level){
  let canvas=uiState.levelPreviewCanvas;
  if(!canvas)return;
  let ctx=canvas.getContext('2d'),cw=canvas.width,ch=canvas.height,map=levelConfig(level),accent=map.accent||'#7edcff';
  ctx.clearRect(0,0,cw,ch);

  let bg=ctx.createLinearGradient(0,0,0,ch);
  bg.addColorStop(0,map.floorA||'#13203b');
  bg.addColorStop(1,map.floorB||'#1c315a');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,cw,ch);

  let glow=ctx.createRadialGradient(cw*.5,ch*.38,4,cw*.5,ch*.38,cw*.58);
  glow.addColorStop(0,(map.glow||'#7edcff18').replace(/\)$/,''));
  glow.addColorStop(0,'#ffffff00');
  ctx.fillStyle=map.glow||'#7edcff14';
  ctx.fillRect(0,0,cw,ch);

  ctx.save();
  ctx.globalAlpha=.16;
  ctx.strokeStyle=accent;
  ctx.lineWidth=1;
  for(let i=-4;i<=4;i++){
    ctx.beginPath();
    ctx.moveTo(cw/2+i*16,ch*.42);
    ctx.lineTo(cw/2+i*38,ch);
    ctx.stroke();
  }
  for(let i=0;i<5;i++){
    let y=ch*.43+Math.pow(i/4,1.65)*ch*.55;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(cw,y);
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle='#ffffff0f';
  ctx.lineWidth=1;
  for(let y=12;y<ch;y+=16){
    ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(cw,y+.5);ctx.stroke();
  }
  for(let x=12;x<cw;x+=16){
    ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,ch);ctx.stroke();
  }

  for(const h of map.hazards||[]){
    ctx.save();
    ctx.strokeStyle=h.color||accent;
    ctx.fillStyle=(h.color||accent)+'28';
    ctx.lineWidth=2;
    if(h.type==='laser'){
      ctx.shadowColor=h.color||accent;
      ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.moveTo(previewScaleX(h.x1,cw),previewScaleY(h.y1,ch));
      ctx.lineTo(previewScaleX(h.x2,cw),previewScaleY(h.y2,ch));
      ctx.stroke();
    }else if(h.type==='spinner'){
      let arms=Math.max(1,Math.round(num(h.arms,2))),angle=num(h.phase);
      let cx2=previewScaleX(h.x,cw),cy2=previewScaleY(h.y,ch),radius=previewScaleX(h.radius,cw);
      ctx.fillStyle='#08111f';
      ctx.beginPath();ctx.arc(cx2,cy2,10,0,7);ctx.fill();
      for(let i=0;i<arms;i++){
        let a=angle+i*Math.PI*2/arms;
        ctx.beginPath();
        ctx.moveTo(cx2,cy2);
        ctx.lineTo(cx2+Math.cos(a)*radius,cy2+Math.sin(a)*radius);
        ctx.stroke();
      }
    }else if(h.type==='gravity'){
      let cx2=previewScaleX(h.x,cw),cy2=previewScaleY(h.y,ch),radius=previewScaleX(h.radius,cw);
      ctx.globalAlpha=.5;
      ctx.beginPath();ctx.arc(cx2,cy2,Math.max(10,radius*.2),0,7);ctx.fill();
      ctx.globalAlpha=.7;
      ctx.beginPath();ctx.arc(cx2,cy2,Math.max(14,radius*.45),0,7);ctx.stroke();
      ctx.globalAlpha=.35;
      ctx.beginPath();ctx.arc(cx2,cy2,Math.max(18,radius*.75),0,7);ctx.stroke();
    }else if(h.type==='conveyor'){
      let x=previewScaleX(h.x,cw),y=previewScaleY(h.y,ch),w=previewScaleX(h.w,cw),hh=previewScaleY(h.h,ch);
      previewRoundedRect(ctx,x,y,w,hh,6,(h.color||accent)+'24',(h.color||accent)+'64');
      ctx.globalAlpha=.75;
      ctx.beginPath();
      if(Math.abs(num(h.dy))>Math.abs(num(h.dx))){
        for(let yy=y+6;yy<y+hh-4;yy+=10){
          ctx.moveTo(x+w/2,yy);
          ctx.lineTo(x+w/2,yy+num(h.dy)*6);
        }
      }else{
        for(let xx=x+6;xx<x+w-4;xx+=14){
          ctx.moveTo(xx,y+hh/2);
          ctx.lineTo(xx+num(h.dx)*6,y+hh/2);
        }
      }
      ctx.stroke();
    }else if(h.type==='pulse'){
      let cx2=previewScaleX(h.x,cw),cy2=previewScaleY(h.y,ch),radius=previewScaleX(num(h.maxRadius,180)*.55,cw);
      ctx.globalAlpha=.55;
      ctx.beginPath();ctx.arc(cx2,cy2,radius,0,7);ctx.stroke();
    }else if(h.type==='flame'){
      let style=fireStyle(h.fuel||'forge'),end=flameEnd(h),x1=previewScaleX(h.x,cw),y1=previewScaleY(h.y,ch),x2=previewScaleX(end.x,cw),y2=previewScaleY(end.y,ch);
      ctx.globalAlpha=.42;ctx.strokeStyle=style.outer;ctx.lineWidth=9;ctx.shadowColor=style.glow;ctx.shadowBlur=10;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.globalAlpha=.86;ctx.strokeStyle=style.mid;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.strokeStyle=style.core;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.fillStyle=style.core;ctx.beginPath();ctx.arc(x1,y1,3,0,7);ctx.fill();
    }
    ctx.restore();
  }

  for(const w of [...BORDER_WALLS,...map.walls]){
    let x=previewScaleX(w.x,cw),y=previewScaleY(w.y,ch),ww=previewScaleX(w.w,cw),hh=previewScaleY(w.h,ch),depth=3;
    ctx.fillStyle='#0b1427';
    previewRoundedRect(ctx,x+1,y+depth,ww,hh,4,'#0b1427');
    let wallGrad=ctx.createLinearGradient(x,y,x,y+hh);
    wallGrad.addColorStop(0,'#6d84bd');
    wallGrad.addColorStop(1,'#263962');
    previewRoundedRect(ctx,x,y,ww,hh,4,wallGrad,'#0f1830');
    ctx.fillStyle='rgba(255,255,255,0.14)';
    previewRoundedRect(ctx,x+2,y+2,Math.max(0,ww-4),Math.max(0,hh*.18),3,'rgba(255,255,255,0.14)');
  }

  for(const [type,x0,y0] of levelPowerSpecs(level)){
    let px=previewScaleX(x0,cw),py=previewScaleY(y0,ch),color=(POWER_DEFS[type]||POWER_DEFS.shield).color;
    ctx.save();ctx.translate(px,py);ctx.shadowColor=color;ctx.shadowBlur=7;

    ctx.shadowBlur=0;drawPowerGlyph(ctx,type,.28);ctx.restore();
  }

  let previewCoins=map.bonus?makeBonusCoins(map).slice(0,30).map(c=>[c.x,c.y,c.jackpot]):map.coins.map(c=>[c[0],c[1],false]);
  for(const [x0,y0,jackpot] of previewCoins){
    let px=previewScaleX(x0,cw),py=previewScaleY(y0,ch);
    ctx.save();
    ctx.shadowColor='#ffd166';ctx.shadowBlur=6;
    ctx.fillStyle=jackpot?'#f6c8ff':'#ffd166';
    ctx.beginPath();ctx.arc(px,py,jackpot?3.4:2.3,0,7);ctx.fill();
    ctx.restore();
  }

  let previewDifficulty=onlineSession()&&!isLobbyOwner()?normalizeDifficulty(game.nextDifficulty||game.difficulty):selectedDifficulty;
  let previewCfg=difficultyConfig(previewDifficulty);
  let previewEnemyCount=Math.min((map.enemies||[]).length,previewCfg.enemyCount+map.enemyBonus);
  (map.enemies||[]).slice(0,previewEnemyCount).forEach(([x0,y0],i)=>{
    let px=previewScaleX(x0,cw),py=previewScaleY(y0,ch),type=(map.enemyTypes&&map.enemyTypes[i])||'hunter',def=ENEMY_DEFS[type]||ENEMY_DEFS.hunter;
    ctx.save();ctx.translate(px,py);ctx.shadowColor=def.color;ctx.shadowBlur=7;
    drawEnemyGlyph(ctx,type,type==='warden'?.48:type==='brute'?.34:.28);
    ctx.restore();
  });

  if(!map.boss&&!map.bonus){
    let ex=previewScaleX(map.exit[0],cw),ey=previewScaleY(map.exit[1],ch);
    ctx.save();
    ctx.shadowColor='#80ff72';ctx.shadowBlur=10;
    ctx.strokeStyle='#80ff72';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(ex,ey,9,0,7);ctx.stroke();
    ctx.fillStyle='rgba(128,255,114,0.18)';
    ctx.beginPath();ctx.arc(ex,ey,9,0,7);ctx.fill();
    ctx.restore();
  }

  previewRoundedRect(ctx,1,1,cw-2,ch-2,11,null,'rgba(115,233,255,0.62)');
}

function startDash(p,c){
  if(!p||!p.alive)return false;
  c=inputSafe(c);let l=hypot(c.x,c.y);if(l<.001)return false;c.x/=l;c.y/=l;

  p.hitTime=0;p.hitVX=0;p.hitVY=0;p.dt=p.boost>0?.25:.2;
  p.cd=playerDashCooldown(p);p.dx=c.x;p.dy=c.y;p.dashHit=p.dt+DASH_ENEMY_GRACE;
  game.shake=Math.max(num(game.shake),.045);
  p.trail.push({x:num(p.x),y:num(p.y),dx:p.dx,dy:p.dy,at:performance.now(),life:420,ring:true,flame:p.boost>0});
  p.trail=p.trail.slice(-16);

  return true;
}

  for(const item of targets){
    let e=item.e,falloff=clamp(1-item.d/(CRYO_RADIUS*1.15),.45,1);

const NAV_SEARCHES_PER_TICK=2;
let navSearchBudget=0;
function enemyNavGoal(e,targetX,targetY,dt){

  if(e.navStuck>=.65){
    let moved=hypot(e.x-num(e.navProgressX,e.x),e.y-num(e.navProgressY,e.y));
    if(moved<3&&hypot(e.vx,e.vy)>4){e.navPath=[];e.navIndex=0;e.navTimer=0;e.vx*=.35;e.vy*=.35}

  game.inkSeq=Math.max(0,Math.round(num(game.inkSeq)));
  let baseX=target?target.x:W/2,baseY=target?target.y:H/2,count=3+stage;
  for(let i=0;i<count;i++){
    let a=Math.random()*Math.PI*2,distance=i===0?18:45+Math.random()*155;
    let x=clamp(baseX+Math.cos(a)*distance,34,W-34),y=clamp(baseY+Math.sin(a)*distance,42,H-42);
    let life=3.5+Math.random()*1.25,r=48+Math.random()*28+stage*3;
    game.inkSplats.push({id:++game.inkSeq,x,y,r,life,maxLife:life,phase:Math.random()*Math.PI*2,tone:i%3});
  }
  game.inkSplats=game.inkSplats.slice(-10);
}
function updateInkSplats(dt){

function updateFirePatches(dt){

    let f=game.firePatches[i];f.life-=dt;

function flameCycleState(h,t=game.hazardTime){
  let period=Math.max(.25,num(h.period,4)),on=clamp(num(h.on,1.45),.05,period),elapsed=((t+num(h.phase))%period+period)%period;
  let off=Math.max(0,period-on),warningLead=Math.min(.9,Math.max(.45,off*.38)),active=elapsed<on;
  let warning=!active&&off>.05&&elapsed>=period-warningLead;
  return{period,on,elapsed,active,warning,warningLead,warningProgress:warning?clamp((elapsed-(period-warningLead))/warningLead,0,1):0};
}
function flameActive(h,t=game.hazardTime){return flameCycleState(h,t).active}

function wall(w){
  let map=levelConfig(game.level),depth=num(map.depth,10),accent=map.accent||'#ff7a24';
  shadow(w.x+w.w/2,w.y+w.h+depth+9,w.w*.5,12,.48);
  cx.save();

  /* Cast-iron extrusion */
  cx.fillStyle=lg(w.x,w.y+w.h,w.x,w.y+w.h+depth,'#332118','#090403');
  cx.beginPath();cx.moveTo(w.x+5,w.y+w.h);cx.lineTo(w.x+w.w-5,w.y+w.h);cx.lineTo(w.x+w.w-2,w.y+w.h+depth);cx.lineTo(w.x+2,w.y+w.h+depth);cx.closePath();cx.fill();

  /* Riveted furnace housing */
  rr(w.x,w.y,w.w,w.h,8,lg(w.x,w.y,w.x,w.y+w.h,'#8b6a52','#2a1a14'),'#0a0503');
  rr(w.x+5,w.y+5,w.w-10,w.h-10,5,lg(w.x,w.y,w.x+w.w,w.y,'#1a100d','#3a251b'),'#b38a6550');

  /* Hazard stripe rail */
  cx.save();cx.beginPath();cx.roundRect(w.x+8,w.y+7,w.w-16,7,3);cx.clip();
  for(let x=w.x-20;x<w.x+w.w+20;x+=18){
    cx.fillStyle=((x/18)|0)%2?'#ffb11f':'#1a0d08';
    cx.save();cx.translate(x,w.y+3);cx.rotate(-.55);cx.fillRect(0,0,12,24);cx.restore();
  }
  cx.restore();

  /* Bolts and hot seams */
  cx.strokeStyle=accent;cx.shadowColor=accent;cx.shadowBlur=9;cx.lineWidth=2;cx.globalAlpha=.72;
  cx.beginPath();cx.moveTo(w.x+12,w.y+w.h-5);cx.lineTo(w.x+w.w-12,w.y+w.h-5);cx.stroke();
  cx.shadowBlur=0;cx.globalAlpha=1;
  let count=Math.max(1,Math.floor(w.w/58));

    let bx=w.x+(i+1)*w.w/(count+1),by=w.y+w.h*.56;

    cx.fillStyle='#21120d';cx.beginPath();cx.arc(bx,by,1.2,0,7);cx.fill();
  }
  cx.restore();
}
function drawCoin(c){
  if(c.taken)return;
  let t=visualNowMs()/250+c.pulse,lift=5+Math.sin(t*.82)*2.4,spin=.25+.75*Math.abs(Math.cos(t*.7)),rw=Math.max(3.5,c.r*spin),jackpot=!!c.jackpot;
  shadow(c.x,c.y+15,jackpot?16:13,jackpot?5:4,.34);
  cx.save();cx.translate(c.x,c.y-lift);

  /* Orbiting energy ring */
  cx.rotate(t*.18);cx.globalAlpha=jackpot?.85:.55;cx.strokeStyle=jackpot?'#f6c8ff':'#fff0a1';cx.lineWidth=1.5;cx.setLineDash([4,5]);
  cx.beginPath();cx.arc(0,0,c.r+7,0,7);cx.stroke();cx.setLineDash([]);cx.rotate(-t*.18);

  cx.fillStyle=jackpot?lg(-rw,0,rw,0,'#6a2b91','#f6c8ff'):lg(-rw,0,rw,0,'#8e5500','#ffd45d');
  cx.beginPath();cx.ellipse(0,0,rw,c.r+1,0,0,7);cx.fill();
  cx.strokeStyle=jackpot?'#fff2ff':'#fff0a5';cx.lineWidth=2;cx.stroke();
  cx.shadowBlur=0;

  cx.globalAlpha=clamp(spin*1.5,0,1);
  cx.fillStyle='#6e4200';cx.beginPath();
  for(let i=0;i<4;i++){let a=Math.PI/4+i*Math.PI/2,x=Math.cos(a)*4.8,y=Math.sin(a)*4.8;i?cx.lineTo(x,y):cx.moveTo(x,y)}
  cx.closePath();cx.fill();
  cx.fillStyle=jackpot?'#ffffff':'#fff6c9';cx.beginPath();cx.ellipse(-rw*.35,-4,Math.max(1,rw*.18),2,-.3,0,7);cx.fill();
  if(jackpot){cx.globalAlpha=clamp(spin*1.7,0,1);cx.strokeStyle='#ffffff';cx.lineWidth=1.2;cx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rad=i%2?3:6;i?cx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):cx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad)}cx.closePath();cx.stroke()}
  cx.globalAlpha=1;

  cx.restore();

function drawPlayer(p){
