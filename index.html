  levelNoise(isBossLevel?.42:.25,{
    when:t,
    frequency:isBossLevel?85:115,
    filterType:'lowpass',
    gain:isBossLevel?.065:.038

  levelTone(root/2,t,step*2.9,'sawtooth',isBossLevel?.055:.032,0);

  /* Unique melodic signature for this arena. */
  theme.lead.forEach((semitone,index)=>{
    let frequency=root*4*Math.pow(2,semitone/12);
    let accent=index===0||index===theme.lead.length-1;
    levelTone(
      frequency,
      t+index*step,
      step*(accent?1.45:.82),
      accent?theme.style:'triangle',
      accent?.034:.025,
      index%2?5:-5
    );
    if(level>=6&&index%2===0){
      levelTone(frequency*1.5,t+index*step+.025,step*.55,'sine',.009,index%4?7:-7);
    }
  });

  /* Short bass phrase and industrial percussion. */

    let when=t+index*step*2;

    levelNoise(.055,{
      when,
      frequency:index===0?105:150,
      filterType:'lowpass',
      gain:index===0?.03:.018

      levelNoise(.035,{
        when:when+step,

      });
    }
  });

    levelTone(
      root*2*Math.pow(2,semitone/12),
      tail,
      isBossLevel?.72:.48,
      index<2?'triangle':'sine',
      isBossLevel?.022:.016,
      (index-1.5)*5
    );
  });
  if(isBossLevel){
    levelNoise(.55,{when:tail,frequency:120,filterType:'lowpass',gain:.045});
    levelTone(root/2,tail,.7,'sawtooth',.045);
  }

function rememberIntroVoice(voice){

    introTone(49,t,.75,'sawtooth',.038,0);
    scheduleIntroChord([164.81,246.94,329.63],t+.12,.8,'sine',.014);

  /* E-minor arcade lead. Null entries are deliberate rests. */
  const lead=[
    659.25,null,783.99,987.77,783.99,null,659.25,587.33,
    659.25,null,783.99,987.77,1174.66,987.77,783.99,null,
    659.25,783.99,987.77,null,1318.51,1174.66,987.77,783.99,
    659.25,null,587.33,659.25,783.99,null,659.25,493.88,
    523.25,null,659.25,783.99,659.25,null,523.25,493.88,
    587.33,null,659.25,783.99,987.77,783.99,659.25,null,
    523.25,659.25,783.99,null,987.77,783.99,659.25,587.33,
    523.25,null,493.88,523.25,659.25,null,493.88,392.00

  const bassRoots=[82.41,82.41,65.41,65.41,98.00,98.00,73.42,73.42];
  bassRoots.forEach((root,bar)=>{
    let barStart=t+bar*8*step;

    [130.81,164.81,196.00,261.63],
    [196.00,246.94,293.66,392.00],
    [146.83,185.00,220.00,293.66]
  ];
  for(let bar=0;bar<8;bar++){
    let chord=arps[Math.floor(bar/2)%arps.length];
    for(let index=0;index<8;index++){
      let freq=chord[index%4]*(index>=4?2:1);
      introTone(freq,t+(bar*8+index)*step,step*.7,'sine',.008,index%2?6:-6);
    }
  }

    introNoise(.032,{when:when+beat/2,frequency:3600,filterType:'highpass',gain:.007});
  }

  /* Short melodic turnaround before the loop returns. */

  introMusicNextStart=t+loopDuration;
  clearTimeout(introMusicTimer);
  let schedulingLead=.2,delay=Math.max(.04,introMusicNextStart-ctx.currentTime-schedulingLead);
  introMusicTimer=setTimeout(()=>{
    scheduleIntroMusicLoop(generation,false,introMusicNextStart);
  },Math.round(delay*1000));
}
function playIntroTune(){

  if(!soundEnabled||!audioUnlocked||!audioPageActive||introMusicPlaying)return;
  let ctx=ensureAudio();if(!ctx)return;
  introMusicPlaying=true;introVoices=[];
  let generation=++introMusicGeneration;
  if(audioMusic){

    audioMusic.gain.setValueAtTime(Math.max(.0001,audioMusic.gain.value),ctx.currentTime);
    audioMusic.gain.setTargetAtTime(.25,ctx.currentTime,.08);

function stopIntroTune(fade=.18){

  if(!audio)return;
  let t=audio.currentTime;
  if(audioMusic){
    try{
      audioMusic.gain.cancelScheduledValues(t);
      audioMusic.gain.setTargetAtTime(.0001,t,Math.max(.025,fade/3));
    }catch(e){}

    try{
      voice.gain.gain.cancelScheduledValues(t);

}

async function ensureRtcCertificate(){

function releasePlayerIdMappings(id,exceptToken=''){

function allocateOnlinePlayerId(clientToken){

const SIGNAL_RECONNECT_MAX_DELAY=10000;

}
function signalReconnectDelay(attempt){return Math.min(SIGNAL_RECONNECT_MAX_DELAY,500*Math.pow(2,Math.min(5,Math.max(0,attempt))))}
function hostPeerIsComplete(token){

async function ensureOnlineHostPeer(token){

function restoreSignalMembers(members){

  net.signalMembers=tokens;

function scheduleRoomSocketReconnect(session=net.session){

async function createOnlineHostPeer(clientToken){

  if(existing){

async function acceptOnlineOffer(message){

  let hostToken=String(message.from||'');if(!hostToken)return;
  if(net.pc)try{net.pc.close()}catch(e){}
  for(const record of net.signalPeers.values())closeSignalRecord(record);
  net.signalPeers.clear();
  let peer=pc(),record={token:hostToken,id:Math.max(1,Math.round(num(message.playerId,1))),pc:peer,remoteCandidates:[],localCandidates:[],descriptionSent:false,retired:false,createdAt:Date.now()};
  net.pc=peer;net.signalHost=hostToken;net.signalPeers.set(hostToken,record);

async function handleSignalMessage(message){
  if(!message||typeof message!=='object')return;
  if(message.to&&message.to!==net.clientToken)return;
  if(message.type==='peer-joined'&&net.role==='host'&&message.role==='player'){
    let token=String(message.clientId||'');net.signalMembers.add(token);net.signalRetries.set(token,0);
    setSessionStatus('A player requested to join. Connecting…');notifyLobby('JOIN REQUEST RECEIVED · CONNECTING PLAYER','pending',7200,true);
    await ensureOnlineHostPeer(token);return;
  }
  if(message.type==='peer-left'){
    let token=String(message.clientId||'');
    if(net.role==='host'&&message.role==='player'){
      net.signalMembers.delete(token);net.signalRetries.delete(token);
      let record=net.signalPeers.get(token),id=record&&record.id||net.clientSlots.get(token)||0;
      let control=id&&net.channels.get(id),state=id&&net.stateChannels.get(id),transportAlive=!!((control&&control.readyState==='open')||(state&&state.readyState==='open')||(record&&record.pc&&record.pc.connectionState==='connected'));
      if(!transportAlive){
        if(record){closeSignalRecord(record);net.signalPeers.delete(token)}
        if(id)markRemoteDisconnected(id);else notifyLobby('PLAYER LEFT BEFORE CONNECTION COMPLETED','error',4200,false);
      }
    }else if(net.role==='client'&&message.role==='host'&&!connectedClient()){
      setSessionStatus('Host disconnected.');syncSetupUI();ui(true);
    }
    return;
  }
  if(message.type==='room-error'){
    let error=String(message.error||'Room error.');if(net.role==='client')setLobbyStage('error',error,'error',6200);setSetupStatus(error);return;
  }
  if(message.type!=='signal')return;
  let from=String(message.from||'');
  if(net.role==='client'&&message.fromRole==='host'&&message.description){await acceptOnlineOffer(message);return}
  let record=net.signalPeers.get(from);
  if(!record)return;
  if(message.description&&net.role==='host'&&message.description.type==='answer'){
    await record.pc.setRemoteDescription(message.description);await flushSignalCandidates(record);
  }
  if(message.candidate)await addSignalCandidate(record,message.candidate);
}
function openRoomSocket(role,code,reconnecting=false){
  return new Promise((resolve,reject)=>{
    let session=net.session,settled=false,ready=false,ws=new WebSocket(signalSocketUrl(code,role,net.clientToken));
    if(!reconnecting){clearSignalReconnect();net.signalReconnectAttempt=0;net.signalRole=role}else if(!net.signalRole)net.signalRole=role;
    net.signal=ws;
    let timeout=setTimeout(()=>{if(!settled){settled=true;try{ws.close()}catch(e){}reject(Error('Room unavailable'))}},12000);
    ws.onmessage=e=>{
      if(!sameSession(session)||net.signal!==ws)return;
      let message;try{message=JSON.parse(e.data)}catch(err){return}
      if(message.type==='room-ready'){
        ready=true;net.signalReady=true;net.signalReconnectAttempt=0;clearSignalReconnect();clearTimeout(timeout);
        if(role==='host')restoreSignalMembers(message.members);
        else if(net.role==='client'&&!net.localId){net.lobbyStage='waiting';net.lobbyRevision++;setSetupStatus('Room found. Host has been notified…')}
        if(!settled){settled=true;resolve(message)}
        syncSetupUI();ui(true);return;
      }
      handleSignalMessage(message).catch(err=>{console.error(err);setSetupStatus('Connection failed.')});
    };
    ws.onerror=()=>{clearTimeout(timeout);if(!settled){settled=true;reject(Error('Room unavailable'))}};
    ws.onclose=()=>{
      clearTimeout(timeout);if(!sameSession(session))return;
      if(net.signal===ws)net.signal=null;
      net.signalReady=false;
      if(!settled){settled=true;reject(Error('Room unavailable'))}
      if(reconnecting||ready)scheduleRoomSocketReconnect(session);
      syncSetupUI();ui(true);
    };
  });
}

function canvasDrawGame(){
  canvasSetFocusScope('game','');captureWorldFrame();let view=composeWorldFrame();canvasDrawHud();
  if(game.phase==='count'||game.phase==='level'){
    cx.save();cx.fillStyle='#000a';cx.fillRect(view.x,view.y,view.w,view.h);cx.restore();
    canvasText(game.phase==='level'?game.levelName:Math.max(1,Math.ceil(game.count)),view.x+view.w/2,view.y+view.h/2-12,game.phase==='level'?30:66,'center',UI.text,1000);
    if(game.phase==='level')canvasText(game.levelHint,view.x+view.w/2,view.y+view.h/2+28,13,'center',UI.cyanSoft,850,view.w-80);
  }
  let overlay=activeOverlay();
  if(!overlay&&!game.over)canvasDrawTouchControls();
  if(!overlay)return;
  canvasHits.length=0;
  if(overlay==='menu')canvasDrawMenu();
  else if(overlay==='help')canvasDrawHelp();
  else if(overlay==='confirm')canvasDrawConfirm();
  else if(overlay==='chat')canvasDrawChat();
  else if(overlay==='input'&&canvasTouchDevice)canvasDrawKeyboard();
}
function nextResultLevel(){
  if(isBonusLevel())return game.level<LEVELS.length?game.level+1:CAMPAIGN_LEVEL_COUNT+1;
  return game.level>=CAMPAIGN_LEVEL_COUNT?1:game.level+1;
}
function resultPrimaryLabel(){
  if(!game.won)return'RETRY LEVEL';
  if(isBonusLevel())return game.level<LEVELS.length?'NEXT BONUS':'PLAY AGAIN';
  return game.level>=CAMPAIGN_LEVEL_COUNT?'PLAY AGAIN':'NEXT LEVEL';
}
function startNextLevel(){
  if(net.role==='client')return;let next=nextResultLevel();selectedLevel=next;selectedDifficulty=normalizeDifficulty(game.difficulty);saveLevelProgress();beginRun(selectedDifficulty,next);
}

function canvasGameplayPointerMove(e,p){let rec=canvasPointers.get(e.pointerId);if(!rec||rec.type!=='joy')return;let dx=p.x-rec.anchor.x,dy=p.y-rec.anchor.y,d=hypot(dx,dy),m=Math.min(1,d/62);touch.x=d?dx/d*m:0;touch.y=d?dy/d*m:0}
function canvasGameplayPointerEnd(e){let rec=canvasPointers.get(e.pointerId);if(!rec)return;if(rec.type==='joy'){touch.on=false;touch.id=null;touch.x=touch.y=0;touch.engaged=false}else if(rec.type==='dash')touch.dash=false;else if(rec.type==='super'){touch.super=false;touch.superSlot=-1}canvasPointers.delete(e.pointerId)}

function syncOrientationMode(){
  let locked=portraitMode();cv.classList.toggle('portrait-lock',locked);
  let gameplayLocked=locked&&gameplayScreenVisible();
  if(gameplayLocked&&!orientationWasLocked){
    resetGameplayInput();
    if(net.role!=='client'&&!game.over&&!game.paused&&game.phase!=='menu'){
      orientationPaused=true;game.paused=true;
      if(net.role==='host'){broadcastGameEvent('pause');broadcastNow()}
    }
  }else if(!gameplayLocked&&orientationWasLocked&&orientationPaused){
    orientationPaused=false;
    if(gameplayScreenVisible()&&!game.over&&net.role!=='client'){
      game.paused=false;
      if(net.role==='host'){broadcastGameEvent('resume');broadcastPulse()}
    }
  }
  orientationWasLocked=gameplayLocked;return locked;
}
function fitCanvas(){
  syncOrientationMode();let rect=cv.getBoundingClientRect(),scale=cv.classList.contains('portrait-lock')?Math.max(.05,Math.min(rect.height/W,rect.width/H)):Math.max(.05,Math.min(rect.width/W,rect.height/H));configureCanvasResolution(scale);
}
